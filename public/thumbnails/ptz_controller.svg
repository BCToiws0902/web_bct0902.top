<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Dark Studio Gradient -->
    <radialGradient id="studioLighting" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Glowing Highlights -->
    <linearGradient id="cyanNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0071e3" />
    </linearGradient>

    <linearGradient id="cameraBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="lensGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="pedestalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="1200" height="675" fill="url(#studioLighting)" />

  <!-- Studio Stage Grid / Floor Reflection -->
  <ellipse cx="600" cy="540" rx="420" ry="80" fill="rgba(0, 0, 0, 0.6)" filter="url(#pedestalShadow)" />
  <ellipse cx="600" cy="510" rx="340" ry="50" fill="rgba(0, 113, 227, 0.08)" filter="url(#softGlow)" />

  <!-- MAIN PTZ CONFERENCE CAMERA PRODUCT -->
  <g transform="translate(600, 310)">
    
    <!-- 1. Heavy Motorized Base Pedestal -->
    <ellipse cx="0" cy="180" rx="220" ry="50" fill="url(#cameraBody)" stroke="#475569" stroke-width="2" />
    <path d="M -220 180 C -220 225, 220 225, 220 180 L 220 205 C 220 250, -220 250, -220 205 Z" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Base LED Status Ring (Cyan Glow) -->
    <ellipse cx="0" cy="205" rx="216" ry="48" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#softGlow)" />

    <!-- Brand / Sensor Window on Base -->
    <rect x="-40" y="195" width="80" height="12" rx="6" fill="#020617" stroke="rgba(255, 255, 255, 0.1)" />
    <circle cx="-25" cy="201" r="3" fill="#10b981" />
    <text x="5" y="205" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="700" letter-spacing="1">VISCA USB</text>

    <!-- Motorized Pan Turntable Ring -->
    <ellipse cx="0" cy="150" rx="170" ry="38" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <ellipse cx="0" cy="148" rx="165" ry="36" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1.5" stroke-dasharray="8,6" />

    <!-- 2. Dual Fork Mount Turret Arms (Pan Mechanism) -->
    <!-- Left Arm -->
    <path d="M -150 148 L -150 -40 Q -150 -80, -100 -80 L -80 -80 L -80 135 Z" fill="url(#cameraBody)" stroke="#475569" stroke-width="2" />
    <!-- Right Arm -->
    <path d="M 150 148 L 150 -40 Q 150 -80, 100 -80 L 80 -80 L 80 135 Z" fill="url(#cameraBody)" stroke="#475569" stroke-width="2" />

    <!-- Tilt Pivot Axis Caps -->
    <circle cx="-115" cy="-35" r="28" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#softGlow)" />
    <circle cx="115" cy="-35" r="28" fill="#0f172a" stroke="#00f0ff" stroke-width="2" filter="url(#softGlow)" />

    <!-- 3. Spherical Camera Head (Tilt Mechanism) -->
    <circle cx="0" cy="-35" r="125" fill="url(#cameraBody)" stroke="#334155" stroke-width="2.5" />
    
    <!-- Camera Barrel Ring -->
    <circle cx="0" cy="-35" r="105" fill="#0b0f19" stroke="#475569" stroke-width="2" />
    <circle cx="0" cy="-35" r="95" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#softGlow)" />

    <!-- Multi-Coated Optical Glass Lens Assembly -->
    <circle cx="0" cy="-35" r="85" fill="url(#lensGrad)" />
    <circle cx="0" cy="-35" r="65" fill="#020617" stroke="rgba(0, 240, 255, 0.6)" stroke-width="1.5" />
    <circle cx="0" cy="-35" r="40" fill="#000000" stroke="#38bdf8" stroke-width="1" />

    <!-- Optical Glare Reflections on Glass Lens -->
    <ellipse cx="-25" cy="-60" rx="35" ry="18" fill="rgba(255, 255, 255, 0.45)" transform="rotate(-25 -25 -60)" />
    <ellipse cx="25" cy="-10" rx="16" ry="8" fill="rgba(255, 255, 255, 0.2)" transform="rotate(-25 25 -10)" />
    <circle cx="0" cy="-35" r="8" fill="#00f0ff" filter="url(#softGlow)" />

    <!-- 4. Pan / Tilt Directional Rotation Arcs -->
    <!-- Horizontal Pan Arc -->
    <path d="M -260 148 A 260 60 0 0 1 260 148" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" />
    <polygon points="265,140 280,158 255,158" fill="#00f0ff" transform="rotate(30 265 148)" />
    <polygon points="-265,140 -280,158 -255,158" fill="#00f0ff" transform="rotate(-30 -265 148)" />

    <!-- Vertical Tilt Arc -->
    <path d="M 180 -120 A 180 180 0 0 1 180 50" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" />
    <polygon points="180,-128 194,-112 168,-112" fill="#38bdf8" />
    <polygon points="180,58 194,42 168,42" fill="#38bdf8" />
  </g>

  <!-- Product Title & Badge Overlay -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(0, 240, 255, 0.1)" stroke="#00f0ff" stroke-width="1" />
    <text x="90" y="21" fill="#00f0ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">PTZ HARDWARE UTILITY</text>

    <text x="0" y="72" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="36" font-weight="800" letter-spacing="-0.5">PTZ Controller Portable</text>
    <text x="0" y="102" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="15" font-weight="400">Pan-Tilt-Zoom Conference Camera Controller · Sony VISCA Protocol · Portable .EXE</text>
  </g>
</svg>
